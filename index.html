<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rodinný Nákupní Seznam</title>
    <style>
        :root {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --primary-color: #4f46e5;
            --border-color: #cbd5e1;
            --bought-color: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            box-sizing: border-box; /* Zabrání přetékání boxu */
        }

        h1 {
            text-align: center;
            margin-top: 0;
            color: var(--primary-color);
            font-size: 1.8rem;
        }

        /* Nový responzivní formulář */
        .form-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .inputs-row {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        input {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            font-size: 1rem;
            outline: none;
            box-sizing: border-box;
        }

        #item-input {
            flex: 2; /* Název zabere více místa */
            min-width: 0; /* Oprava přetékání ve flexboxu */
        }

        /* Kontrolky pro množství (+ / -) */
        .counter-group {
            display: flex;
            align-items: center;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            background: #f8fafc;
        }

        .counter-btn {
            background: none;
            border: none;
            padding: 0 12px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            color: var(--text-color);
            height: 100%;
        }

        .counter-btn:hover {
            background-color: #e2e8f0;
        }

        #count-input {
            width: 45px;
            text-align: center;
            border: none;
            background: transparent;
            padding: 0;
            font-weight: bold;
        }

        /* Odstranění šipek z číselného inputu */
        #count-input::-webkit-outer-spin-button,
        #count-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        button.add-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: opacity 0.2s;
        }

        button.add-btn:hover {
            opacity: 0.9;
        }

        /* Seznam položek */
        .shopping-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .shopping-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px;
            background: #f1f5f9;
            margin-bottom: 8px;
            border-radius: 8px;
            transition: all 0.2s;
            cursor: pointer;
        }

        .shopping-item:hover {
            background: #e2e8f0;
        }

        .item-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }

        .item-name {
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis; /* Dlouhý text zkrátí třemi tečkami */
        }

        .item-count {
            background: #cbd5e1;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: bold;
            white-space: nowrap;
        }

        /* Styl pro zakoupené položky */
        .shopping-item.bought {
            background: #f8fafc;
            border: 1px dashed var(--border-color);
            color: var(--bought-color);
        }

        .shopping-item.bought .item-name {
            text-decoration: line-through;
        }

        .shopping-item.bought .item-count {
            background: #e2e8f0;
            color: var(--bought-color);
        }

        .delete-btn {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 1.1rem;
            padding: 4px 8px;
        }

        .clear-container {
            margin-top: 20px;
            text-align: center;
        }

        .clear-btn {
            background: #ef4444;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <h1>🛒 Rodinný Nákup</h1>
        
        <!-- Upravený formulář -->
        <div class="form-container">
            <div class="inputs-row">
                <input type="text" id="item-input" placeholder="Co koupit? (např. Mléko)" required>
                
                <div class="counter-group">
                    <button class="counter-btn" onclick="changeCount(-1)">-</button>
                    <input type="number" id="count-input" value="1" min="1">
                    <button class="counter-btn" onclick="changeCount(1)">+</button>
                </div>
            </div>
            <button class="add-btn" onclick="addItem()">Přidat na seznam</button>
        </div>

        <!-- Seznam -->
        <ul class="shopping-list" id="shopping-list"></ul>

        <!-- Smazat zakoupené -->
        <div class="clear-container" id="clear-container" style="display: none;">
            <button class="clear-btn" onclick="clearBought()">Smazat zakoupené položky</button>
        </div>
    </div>

    <script>
        let shoppingItems = JSON.parse(localStorage.getItem('family_shopping_list')) || [];

        document.addEventListener('DOMContentLoaded', () => {
            renderList();
        });

        function saveItems() {
            localStorage.setItem('family_shopping_list', JSON.stringify(shoppingItems));
        }

        // Funkce pro ovládání tlačítek + a -
        function changeCount(amount) {
            const countInput = document.getElementById('count-input');
            let currentValue = parseInt(countInput.value) || 1;
            currentValue += amount;
            if (currentValue < 1) currentValue = 1;
            countInput.value = currentValue;
        }

        function addItem() {
            const nameInput = document.getElementById('item-input');
            const countInput = document.getElementById('count-input');
            
            const name = nameInput.value.trim();
            const count = parseInt(countInput.value) || 1;

            if (!name) return;

            shoppingItems.push({
                id: Date.now(),
                name: name,
                count: count + 'x',
                bought: false
            });

            saveItems();
            renderList();

            nameInput.value = '';
            countInput.value = '1';
            nameInput.focus();
        }

        function toggleBought(id) {
            shoppingItems = shoppingItems.map(item => {
                if (item.id === id) {
                    return { ...item, bought: !item.bought };
                }
                return item;
            });
            saveItems();
            renderList();
        }

        function deleteItem(id, event) {
            event.stopPropagation();
            shoppingItems = shoppingItems.filter(item => item.id !== id);
            saveItems();
            renderList();
        }

        function clearBought() {
            shoppingItems = shoppingItems.filter(item => !item.bought);
            saveItems();
            renderList();
        }

        function renderList() {
            const listElement = document.getElementById('shopping-list');
            const clearContainer = document.getElementById('clear-container');
            listElement.innerHTML = '';

            const sortedItems = [...shoppingItems].sort((a, b) => a.bought - b.bought);

            sortedItems.forEach(item => {
                const li = document.createElement('li');
                li.className = `shopping-item ${item.bought ? 'bought' : ''}`;
                li.setAttribute('onclick', `toggleBought(${item.id})`);

                li.innerHTML = `
                    <div class="item-info">
                        <span class="item-name">${item.name}</span>
                        <span class="item-count">${item.count}</span>
                    </div>
                    <button class="delete-btn" onclick="deleteItem(${item.id}, event)">🗑️</button>
                `;
                listElement.appendChild(li);
            });

            const hasBought = shoppingItems.some(item => item.bought);
            clearContainer.style.display = hasBought ? 'block' : 'none';
        }

        document.getElementById('item-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') addItem();
        });
    </script>
</body>
</html>
