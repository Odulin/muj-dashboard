<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rodinný Nákup</title>
<style>
:root { --bg: #f1f5f9; --card: #ffffff; --text: #1e293b; --prime: #4f46e5; --border: #cbd5e1; }
body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
.app-container { width: 100%; max-width: 480px; background: var(--card); padding: 20px; border-radius: 16px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); box-sizing: border-box; }
h1 { text-align: center; margin-top: 0; color: var(--prime); }
.user-status { display: flex; justify-content: space-between; align-items: center; background: #eef2ff; padding: 8px 12px; border-radius: 8px; margin-bottom: 15px; font-size: 0.9rem; font-weight: bold; }
.logout-btn { background: none; border: none; color: #ef4444; cursor: pointer; font-weight: bold; }
.form-container, .auth-container { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
.inputs-row { display: flex; gap: 10px; }
input { padding: 12px; border-radius: 8px; border: 1px solid var(--border); font-size: 1rem; outline: none; box-sizing: border-box; }
#item-input { flex: 2; min-width: 0; }
.counter-group { display: flex; align-items: center; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: #f8fafc; }
.counter-btn { background: none; border: none; padding: 0 12px; font-size: 1.2rem; font-weight: bold; cursor: pointer; }
#count-input { width: 45px; text-align: center; border: none; background: transparent; font-weight: bold; }
#count-input::-webkit-outer-spin-button, #count-input::-webkit-inner-spin-button { -webkit-appearance: none; }
button.primary-btn { width: 100%; padding: 14px; background: var(--prime); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
button.secondary-btn { background: none; border: none; color: var(--prime); cursor: pointer; text-decoration: underline; font-size: 0.9rem; }
.shopping-list { list-style: none; padding: 0; margin: 0; }
.shopping-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; background: #f1f5f9; margin-bottom: 8px; border-radius: 8px; gap: 10px; }
.item-info { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
.item-top-row { display: flex; align-items: center; gap: 12px; }
.item-name { font-weight: 500; }
.item-count { background: #cbd5e1; padding: 2px 8px; border-radius: 12px; font-size: 0.85rem; font-weight: bold; }
.item-meta { font-size: 0.75rem; color: #64748b; line-height: 1.3; }
.action-btns { display: flex; gap: 4px; }
.action-btn { background: none; border: none; cursor: pointer; font-size: 1.1rem; padding: 6px; border-radius: 6px; }
.shopping-item.bought { background: #f0fdf4; border: 1px solid #bbf7d0; }
.shopping-item.bought .item-name { text-decoration: line-through; color: #166534; }
.shopping-item.deleted { background: #fef2f2; border: 1px dashed #fca5a5; }
.shopping-item.deleted .item-name { text-decoration: line-through; color: #991b1b; opacity: 0.6; }
.clear-container { margin-top: 20px; text-align: center; }
.clear-btn { background: #64748b; color: white; border: none; width: 100%; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; }
.admin-panel { margin-top: 25px; padding-top: 15px; border-top: 3px dashed #dc2626; }
.user-list { list-style: none; padding: 0; margin: 0; }
.user-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; background: #fef2f2; border: 1px solid #fca5a5; margin-bottom: 6px; border-radius: 6px; }
</style>
</head>
<body>
<div class="app-container">
<h1>🛒 Rodinný Nákup</h1>
<div id="auth-section" class="auth-container">
<h2 id="auth-title" style="margin:0;font-size:1.2rem;">Přihlášení</h2>
<input type="text" id="username-input" placeholder="Jméno"><input type="password" id="password-input" placeholder="Heslo">
<button class="primary-btn" id="auth-submit-btn" onclick="handleAuth()">Přihlásit se</button>
<button class="secondary-btn" id="auth-toggle-btn" onclick="toggleAuthMode()">Nemáte účet? Registrace</button>
</div>
<div id="main-app-section" style="display:none;">
<div class="user-status" id="status-box"><span>👤: <span id="current-user-display"></span></span><button class="logout-btn" onclick="logout()">Odhlásit</button></div>
<div class="form-container"><div class="inputs-row"><input type="text" id="item-input" placeholder="Co koupit?" required>
<div class="counter-group"><button class="counter-btn" onclick="changeCount(-1)">-</button><input type="number" id="count-input" value="1" min="1"><button class="counter-btn" onclick="changeCount(1)">+</button></div></div>
<button class="primary-btn" onclick="addItem()">Přidat na seznam</button></div>
<ul class="shopping-list" id="shopping-list"></ul>
<div class="clear-container" id="clear-container" style="display:none;"><button class="clear-btn" onclick="clearAllArchive()">Vyčistit vyřízené položky</button></div>
<div id="admin-section" class="admin-panel" style="display:none;"><h3 style="color:#dc2626;margin:0 0 10px 0;">🛡️ Uživatelé</h3><ul class="user-list" id="user-list"></ul></div>
</div>
</div>
<script>
const BIN_URL = "https://kvbin.com"; 
let appData = { users: [], shoppingItems: [] };
let isRegisterMode = false;
let currentUser = localStorage.getItem('family_current_user') || null;

document.addEventListener('DOMContentLoaded', async () => {
    await loadCloudData();
    checkLoginState();
    setInterval(async () => { if (currentUser) { await loadCloudData(); renderList(); if (currentUser === 'admin') renderUserList(); } }, 4000);
});

async function loadCloudData() {
    try {
        const res = await fetch(BIN_URL);
        if (res.ok) { const data = await res.json(); if (data) appData = data; }
    } catch (e) { console.log("Načítání z cloudu..."); }
    if (!appData.users) appData.users = [];
    if (!appData.shoppingItems) appData.shoppingItems = [];
}

async function saveCloudData() {
    try {
        await fetch(BIN_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(appData) });
    } catch (e) { console.log("Chyba synchronizace, zkouším znovu."); }
}

function checkLoginState() {
    const authBox = document.getElementById('auth-section'); const mainBox = document.getElementById('main-app-section');
    const adminBox = document.getElementById('admin-section'); const statBox = document.getElementById('status-box');
    if (currentUser) {
        authBox.style.display = 'none'; mainBox.style.display = 'block'; document.getElementById('current-user-display').innerText = currentUser;
        if (currentUser === 'admin') { adminBox.style.display = 'block'; statBox.style.background = '#fef2f2'; statBox.style.color = '#dc2626'; renderUserList(); }
        else { adminBox.style.display = 'none'; statBox.style.background = '#eef2ff'; statBox.style.color = '#1e293b'; }
        renderList();
    } else { authBox.style.display = 'flex'; mainBox.style.display = 'none'; adminBox.style.display = 'none'; }
}

function toggleAuthMode() {
    isRegisterMode = !isRegisterMode;
    document.getElementById('auth-title').innerText = isRegisterMode ? 'Registrace' : 'Přihlášení';
    document.getElementById('auth-submit-btn').innerText = isRegisterMode ? 'Vytvořit účet' : 'Přihlásit se';
    document.getElementById('auth-toggle-btn').innerText = isRegisterMode ? 'Zpět na Přihlášení' : 'Nemáte účet? Registrace';
}

async function handleAuth() {
    const name = document.getElementById('username-input').value.trim(); const pass = document.getElementById('password-input').value;
    if (!name || !pass) { alert('Vyplňte údaje.'); return; }
    if (name.toLowerCase() === 'admin' && pass === 'admin') { currentUser = 'admin'; localStorage.setItem('family_current_user', currentUser); clearAuth(); checkLoginState(); return; }
    
    if (isRegisterMode) {
        if (name.toLowerCase() === 'admin' || appData.users.some(u => u.username.toLowerCase() === name.toLowerCase())) { alert('Jméno nelze použít.'); return; }
        appData.users.push({ id: Date.now(), username: name, password: btoa(pass) });
        await saveCloudData(); currentUser = name;
    } else {
        const u = appData.users.find(u => u.username.toLowerCase() === name.toLowerCase() && u.password === btoa(pass));
        if (!u) { alert('Chyba jména/hesla.'); return; } currentUser = u.username;
    }
    localStorage.setItem('family_current_user', currentUser); clearAuth(); checkLoginState();
}

function clearAuth() { document.getElementById('username-input').value = ''; document.getElementById('password-input').value = ''; }
function logout() { currentUser = null; localStorage.removeItem('family_current_user'); checkLoginState(); }

function renderUserList() {
    const el = document.getElementById('user-list'); el.innerHTML = '';
    appData.users.forEach((u, idx) => {
        const li = document.createElement('li'); li.className = 'user-item';
        li.innerHTML = `<div><strong>${u.username}</strong><br><span style="font-size:0.8rem;color:#64748b;">Heslo: ${atob(u.password)}</span></div><button class="logout-btn" onclick="deleteUser(${idx})">❌</button>`;
        el.appendChild(li);
    });
}

async function deleteUser(idx) { if (confirm('Smazat uživatele?')) { appData.users.splice(idx, 1); await saveCloudData(); renderUserList(); } }
function changeCount(amt) { const input = document.getElementById('count-input'); let val = (parseInt(input.value) || 1) + amt; if (val < 1) val = 1; input.value = val; }
function getTime() { const n = new Date(); return `${n.getDate()}. ${n.getMonth() + 1}. v ${n.getHours()}:${n.getMinutes().toString().padStart(2, '0')}`; }

async function addItem() {
    const nIn = document.getElementById('item-input'); const cIn = document.getElementById('count-input'); const name = nIn.value.trim(); if (!name) return;
    appData.shoppingItems.push({ id: Date.now(), name: name, count: cIn.value + 'x', status: 'active', added_by: currentUser, added_at: getTime(), action_by: '', action_at: '', comment: '' });
    nIn.value = ''; cIn.value = '1'; nIn.focus(); await saveCloudData(); renderList();
}

async function markAsBought(id) {
    appData.shoppingItems = appData.shoppingItems.map(i => {
        if (i.id === id) { const isB = i.status === 'bought'; return { ...i, status: isB ? 'active' : 'bought', action_by: isB ? '' : currentUser, action_at: isB ? '' : getTime() }; } return i;
    });
    await saveCloudData(); renderList();
}

async function markAsDeleted(id) {
    const item = appData.shoppingItems.find(i => i.id === id);
    if (item.status === 'deleted') {
        appData.shoppingItems = appData.shoppingItems.map(i => i.id === id ? { ...i, status: 'active', action_by: '', action_at: '', comment: '' } : i);
    } else {
        const msg = prompt(`Důvod odebrání "${item.name}"?:`) || '';
        appData.shoppingItems = appData.shoppingItems.map(i => i.id === id ? { ...i, status: 'deleted', action_by: currentUser, action_at: getTime(), comment: msg.trim() } : i);
    }
    await saveCloudData(); renderList();
}

async function clearAllArchive() { if (confirm('Trvale smazat?')) { appData.shoppingItems = appData.shoppingItems.filter(i => i.status === 'active'); await saveCloudData(); renderList(); } }

function renderList() {
    const listEl = document.getElementById('shopping-list'); const clearEl = document.getElementById('clear-container'); listEl.innerHTML = '';
    const sorted = [...appData.shoppingItems].sort((a, b) => { const s = { 'active': 1, 'bought': 2, 'deleted': 3 }; return s[a.status] - s[b.status]; });
    sorted.forEach(i => {
        const li = document.createElement('li'); li.className = `shopping-item ${i.status}`;
        let meta = `✍️ ${i.added_by} (${i.added_at})`;
        if (i.status === 'bought') meta += `<br>✅ Koupil: ${i.action_by} (${i.action_at})`;
        else if (i.status === 'deleted') { meta += `<br>❌ Odebral: ${i.action_by} (${i.action_at})`; if (i.comment) meta += `<br>💬: "${i.comment}"`; }
        let btns = i.status === 'active' ? `<button class="action-btn" onclick="markAsBought(${i.id})">✅</button><button class="action-btn" onclick="markAsDeleted(${i.id})">🗑️</button>` : `<button class="action-btn" onclick="${i.status === 'bought' ? 'markAsBought' : 'markAsDeleted'}(${i.id})">↩️</button>`;
        li.innerHTML = `<div class="item-info"><div class="item-top-row"><span class="item-name">${i.name}</span><span class="item-count">${i.count}</span></div><div class="item-meta">${meta}</div></div><div class="action-btns">${btns}</div>`;
        listEl.appendChild(li);
    });
    clearEl.style.display = appData.shoppingItems.some(i => i.status !== 'active') ? 'block' : 'none';
}
document.getElementById('item-input').addEventListener('keypress', function(e) { if (e.key === 'Enter') addItem(); });
</script>

</body>
</html>
