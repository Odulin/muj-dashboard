<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rodinný Nákup</title>
<style>
:root { --bg: #f1f5f9; --card: #ffffff; --text: #1e293b; --prime: #4f46e5; --border: #cbd5e1; }
body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
.app-container { width: 100%; max-width: 480px; background: var(--card); padding: 20px; border-radius: 16px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); box-sizing: border-box; }
h1 { text-align: center; margin-top: 0; color: var(--prime); }
.user-status { display: flex; justify-content: space-between; align-items: center; background: #eef2ff; padding: 8px 12px; border-radius: 8px; margin-bottom: 15px; font-size: 0.9rem; font-weight: bold; }
.logout-btn { background: none; border: none; color: #ef4444; cursor: pointer; font-weight: bold; }
.form-container, .auth-container { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
.inputs-row { display: flex; gap: 10px; }
input { padding: 12px; border-radius: 8px; border: 1px solid var(--border); font-size: 1rem; outline: none; box-sizing: border-box; }
#item-input { flex: 2; min-width: 0; }
.counter-group { display: flex; align-items: center; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: #f8fafc; }
.counter-btn { background: none; border: none; padding: 0 12px; font-size: 1.2rem; font-weight: bold; cursor: pointer; }
#count-input { width: 45px; text-align: center; border: none; background: transparent; font-weight: bold; }
#count-input::-webkit-outer-spin-button, #count-input::-webkit-inner-spin-button { -webkit-appearance: none; }
button.primary-btn { width: 100%; padding: 14px; background: var(--prime); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
button.secondary-btn { background: none; border: none; color: var(--prime); cursor: pointer; text-decoration: underline; font-size: 0.9rem; }
.shopping-list { list-style: none; padding: 0; margin: 0; }
.shopping-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; background: #f1f5f9; margin-bottom: 8px; border-radius: 8px; gap: 10px; }
.item-info { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
.item-top-row { display: flex; align-items: center; gap: 12px; }
.item-name { font-weight: 500; }
.item-count { background: #cbd5e1; padding: 2px 8px; border-radius: 12px; font-size: 0.85rem; font-weight: bold; }
.item-meta { font-size: 0.75rem; color: #64748b; line-height: 1.3; }
.action-btns { display: flex; gap: 4px; }
.action-btn { background: none; border: none; cursor: pointer; font-size: 1.1rem; padding: 6px; border-radius: 6px; }
.shopping-item.bought { background: #f0fdf4; border: 1px solid #bbf7d0; }
.shopping-item.bought .item-name { text-decoration: line-through; color: #166534; }
.shopping-item.deleted { background: #fef2f2; border: 1px dashed #fca5a5; }
.shopping-item.deleted .item-name { text-decoration: line-through; color: #991b1b; opacity: 0.6; }
.clear-container { margin-top: 20px; text-align: center; }
.clear-btn { background: #64748b; color: white; border: none; width: 100%; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; }
</style>
</head>
<body>
<div class="app-container">
<h1>🛒 Rodinný Nákup</h1>
<div id="auth-section" class="auth-container">
<h2 id="auth-title" style="margin:0;font-size:1.2rem;">Přihlášení</h2>
<input type="text" id="username-input" placeholder="Uživatelské jméno" autocomplete="username"><input type="password" id="password-input" placeholder="Heslo" autocomplete="current-password">
<button class="primary-btn" id="auth-submit-btn" onclick="handleAuth()">Přihlásit se</button>
<button class="secondary-btn" id="auth-toggle-btn" onclick="toggleAuthMode()">Nemáte účet? Registrace</button>
</div>
<div id="main-app-section" style="display:none;">
<div class="user-status" id="status-box"><span>👤: <span id="current-user-display"></span></span><button class="logout-btn" onclick="logout()">Odhlásit</button></div>
<div id="admin-panel" style="display:none; margin-bottom:20px;">
    <h3 style="margin:0 0 10px 0;">Uživatelé</h3>
    <ul id="admin-users-list" style="list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:8px;"></ul>
</div>
<div class="form-container"><div class="inputs-row"><input type="text" id="item-input" placeholder="Co koupit?" required>
<div class="counter-group"><button class="counter-btn" onclick="changeCount(-1)">-</button><input type="number" id="count-input" value="1" min="1"><button class="counter-btn" onclick="changeCount(1)">+</button></div></div>
<button class="primary-btn" onclick="addItem()">Přidat na seznam</button></div>
<ul class="shopping-list" id="shopping-list"></ul>
<div class="clear-container" id="clear-container" style="display:none;"><button class="clear-btn" onclick="clearAllArchive()">Vyčistit vyřízené položky</button></div>
</div>
</div>
<script>
const SUPABASE_URL = "https://hyzidgahsjfbcvnsqooe.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_A8hqoD7YSDF95LgPy6LZNA_pvuW3P6m";
const SESSION_KEY = "family_supabase_session";
const ADMIN_USERNAME = 'admin';
const ADMIN_PASSWORD = 'admin';
let appData = { shoppingItems: {}, users: [] };
let isRegisterMode = false;
let currentUser = null;

document.addEventListener('DOMContentLoaded', async () => {
    const savedSession = localStorage.getItem(SESSION_KEY);
    if (savedSession) {
        try {
            const session = JSON.parse(savedSession);
            currentUser = session.username || null;
        } catch (error) {
            console.error('Nepodařilo se obnovit relaci:', error);
            localStorage.removeItem(SESSION_KEY);
        }
    }
    checkLoginState();
    if (currentUser) {
        try {
            await loadCloudData();
            if (currentUser === ADMIN_USERNAME) {
                await loadUsers();
                renderAdminUsers();
            }
            renderList();
        } catch (error) {
            console.error('Načtení nákupního seznamu selhalo:', error);
            alert(`Nákupní seznam se nepodařilo načíst: ${error.message}`);
        }
    }
    setInterval(async () => {
        if (!currentUser) return;
        try {
            await loadCloudData();
            renderList();
        } catch (error) {
            console.error('Synchronizace nákupního seznamu selhalo:', error);
        }
    }, 3000);
});

function supabaseUrl(path) {
    return `${SUPABASE_URL.replace(/\/$/, '')}${path}`;
}

function saveSession(username) {
    currentUser = username;
    localStorage.setItem(SESSION_KEY, JSON.stringify({ username }));
}

async function supabaseRequest(path, { method = 'GET', body, prefer } = {}) {
    if (!SUPABASE_URL.startsWith('https://') || SUPABASE_URL.includes('YOUR_PROJECT') ||
        !SUPABASE_ANON_KEY || SUPABASE_ANON_KEY.includes('YOUR_SUPABASE')) {
        throw new Error('Nejdříve v index.html nastavte URL projektu a veřejný anon key ze Supabase.');
    }

    const headers = { apikey: SUPABASE_ANON_KEY };
    if (body !== undefined) headers['Content-Type'] = 'application/json';
    if (prefer) headers.Prefer = prefer;

    const response = await fetch(supabaseUrl(path), {
        method,
        headers,
        body: body === undefined ? undefined : JSON.stringify(body)
    });

    const responseText = await response.text();
    let data = null;
    if (responseText) {
        try {
            data = JSON.parse(responseText);
        } catch {
            throw new Error(`Supabase vrátil nečitelnou odpověď (${response.status}).`);
        }
    }
    if (!response.ok) {
        throw new Error(data?.msg || data?.message || data?.error_description || data?.error || `Požadavek Supabase selhal (${response.status}).`);
    }
    return data;
}

async function loadCloudData() {
    const rows = await supabaseRequest('/rest/v1/family_shopping_list?select=*&order=id.asc');
    appData.shoppingItems = Object.fromEntries(rows.map(row => [row.id, {
        id: row.id,
        name: row.name,
        count: row.count,
        status: row.status,
        added_by: row.added_by,
        added_at: row.added_at,
        action_by: row.action_by || '',
        action_at: row.action_at || '',
        comment: row.comment || ''
    }]));
}

async function loadUsers() {
    const rows = await supabaseRequest('/rest/v1/family_users?select=*&order=id.asc');
    appData.users = rows.filter(user => user.username !== ADMIN_USERNAME);
}

function renderAdminUsers() {
    const adminUsersList = document.getElementById('admin-users-list');
    if (!adminUsersList) return;
    adminUsersList.innerHTML = '';
    if (!appData.users.length) {
        adminUsersList.innerHTML = '<li style="color:#64748b;">Žádní uživatelé</li>';
        return;
    }

    appData.users.forEach(user => {
        const li = document.createElement('li');
        li.style.display = 'flex';
        li.style.justifyContent = 'space-between';
        li.style.alignItems = 'center';
        li.style.gap = '8px';
        li.style.padding = '8px 10px';
        li.style.background = '#f8fafc';
        li.style.borderRadius = '8px';
        li.innerHTML = `<span>${escapeHtml(user.username)}</span><button class="action-btn" onclick="deleteUser(${Number(user.id)})" title="Smazat uživatele">🗑️</button>`;
        adminUsersList.appendChild(li);
    });
}

async function deleteUser(id) {
    if (!confirm('Opravdu smazat tohoto uživatele?')) return;
    try {
        await supabaseRequest(`/rest/v1/family_users?id=eq.${id}`, { method: 'DELETE' });
        await loadUsers();
        renderAdminUsers();
    } catch (error) {
        console.error('Smazání uživatele selhalo:', error);
        alert(`Uživatele se nepodařilo smazat: ${error.message}`);
    }
}

function checkLoginState() {
    const authBox = document.getElementById('auth-section');
    const mainBox = document.getElementById('main-app-section');
    const statBox = document.getElementById('status-box');
    const adminPanel = document.getElementById('admin-panel');
    const isAdmin = currentUser === ADMIN_USERNAME;
    if (currentUser) {
        authBox.style.display = 'none';
        mainBox.style.display = 'block';
        document.getElementById('current-user-display').innerText = isAdmin ? `${currentUser} (admin)` : currentUser;
        statBox.style.background = isAdmin ? '#fef3c7' : '#eef2ff';
        statBox.style.color = isAdmin ? '#78350f' : '#1e293b';
        if (adminPanel) adminPanel.style.display = isAdmin ? 'block' : 'none';
        renderList();
        if (isAdmin) renderAdminUsers();
    } else {
        authBox.style.display = 'flex';
        mainBox.style.display = 'none';
        if (adminPanel) adminPanel.style.display = 'none';
    }
}

function toggleAuthMode() {
    isRegisterMode = !isRegisterMode;
    document.getElementById('auth-title').innerText = isRegisterMode ? 'Registrace' : 'Přihlášení';
    document.getElementById('auth-submit-btn').innerText = isRegisterMode ? 'Vytvořit účet' : 'Přihlásit se';
    document.getElementById('auth-toggle-btn').innerText = isRegisterMode ? 'Zpět na Přihlášení' : 'Nemáte účet? Registrace';
    document.getElementById('password-input').autocomplete = isRegisterMode ? 'new-password' : 'current-password';
}

async function handleAuth() {
    const username = document.getElementById('username-input').value.trim();
    const password = document.getElementById('password-input').value;
    if (!username || !password) {
        alert('Vyplňte uživatelské jméno a heslo.');
        return;
    }

    const normalizedUsername = username.toLowerCase();

    try {
        if (isRegisterMode) {
            if (normalizedUsername === ADMIN_USERNAME) {
                alert('Toto jméno je rezervované pro administrátora.');
                return;
            }
            const existing = await supabaseRequest(`/rest/v1/family_users?username=eq.${encodeURIComponent(username)}&select=id`);
            if (existing.length) {
                alert('Uživatelské jméno je již zabrané.');
                return;
            }
            await supabaseRequest('/rest/v1/family_users', {
                method: 'POST',
                body: { username, password }
            });
            alert('Účet byl vytvořen. Nyní se přihlaste.');
            toggleAuthMode();
            clearAuth();
            return;
        }

        if (normalizedUsername === ADMIN_USERNAME && password === ADMIN_PASSWORD) {
            saveSession(ADMIN_USERNAME);
            clearAuth();
            checkLoginState();
            await loadCloudData();
            await loadUsers();
            renderAdminUsers();
            renderList();
            return;
        }

        const users = await supabaseRequest(`/rest/v1/family_users?username=eq.${encodeURIComponent(username)}&select=*`);
        if (!users.length) {
            alert('Špatné uživatelské jméno nebo heslo.');
            return;
        }

        const user = users[0];
        if (user.password !== password) {
            alert('Špatné uživatelské jméno nebo heslo.');
            return;
        }

        saveSession(username);
        clearAuth();
        checkLoginState();
        await loadCloudData();
        renderList();
    } catch (error) {
        console.error('Přihlášení k Supabase selhalo:', error);
        alert(`Přihlášení se nepodařilo: ${error.message}`);
    }
}

function clearAuth() {
    document.getElementById('username-input').value = '';
    document.getElementById('password-input').value = '';
}


async function logout() {
    currentUser = null;
    localStorage.removeItem(SESSION_KEY);
    checkLoginState();
}

function changeCount(amt) {
    const input = document.getElementById('count-input');
    let val = (parseInt(input.value) || 1) + amt;
    if (val < 1) val = 1;
    input.value = val;
}

function getTime() {
    const n = new Date();
    return `${n.getDate()}. ${n.getMonth() + 1}. v ${n.getHours()}:${n.getMinutes().toString().padStart(2, '0')}`;
}

async function addItem() {
    const nIn = document.getElementById('item-input');
    const cIn = document.getElementById('count-input');
    const name = nIn.value.trim();
    if (!name) return;
    try {
        await supabaseRequest('/rest/v1/family_shopping_list', {
            method: 'POST',
            body: {
                name,
                count: String(cIn.value),
                status: 'active',
                added_by: currentUser,
                added_at: getTime()
            }
        });
        nIn.value = '';
        cIn.value = '1';
        nIn.focus();
        await loadCloudData();
        renderList();
    } catch (error) {
        console.error('Přidání položky selhalo:', error);
        alert(`Položku se nepodařilo přidat: ${error.message}`);
    }
}

function escapeHtml(value) {
    return String(value === null || value === undefined ? '' : value).replace(/[&<>"']/g, character => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
    })[character]);
}

async function markAsBought(id) {
    const item = appData.shoppingItems[id];
    if (!item) return;
    const isBought = item.status === 'bought';
    try {
        await supabaseRequest(`/rest/v1/family_shopping_list?id=eq.${id}`, {
            method: 'PATCH',
            body: {
                status: isBought ? 'active' : 'bought',
                action_by: isBought ? null : currentUser,
                action_at: isBought ? null : getTime()
            }
        });
        await loadCloudData();
        renderList();
    } catch (error) {
        console.error('Změna stavu položky selhalo:', error);
        alert(`Stav položky se nepodařilo změnit: ${error.message}`);
    }
}

async function markAsDeleted(id) {
    const item = appData.shoppingItems[id];
    if (!item) return;
    const restore = item.status === 'deleted';
    const comment = restore ? null : (prompt(`Důvod odebrání "${item.name}"?:`) || '').trim();
    try {
        await supabaseRequest(`/rest/v1/family_shopping_list?id=eq.${id}`, {
            method: 'PATCH',
            body: {
                status: restore ? 'active' : 'deleted',
                action_by: restore ? null : currentUser,
                action_at: restore ? null : getTime(),
                comment
            }
        });
        await loadCloudData();
        renderList();
    } catch (error) {
        console.error('Odebrání položky selhalo:', error);
        alert(`Položku se nepodařilo upravit: ${error.message}`);
    }
}

async function clearAllArchive() {
    if (!confirm('Trvale smazat?')) return;
    try {
        await supabaseRequest('/rest/v1/family_shopping_list?status=neq.active', { method: 'DELETE' });
        await loadCloudData();
        renderList();
    } catch (error) {
        console.error('Mazání vyřízených položek selhalo:', error);
        alert(`Vyřízené položky se nepodařilo smazat: ${error.message}`);
    }
}

function renderList() {
    const listEl = document.getElementById('shopping-list');
    const clearEl = document.getElementById('clear-container');
    listEl.innerHTML = '';
    const sorted = Object.values(appData.shoppingItems).sort((a, b) => {
        const s = { active: 1, bought: 2, deleted: 3 };
        return s[a.status] - s[b.status];
    });
    sorted.forEach(i => {
        const li = document.createElement('li');
        li.className = `shopping-item ${i.status}`;
        let meta = `✍️ ${escapeHtml(i.added_by)} (${escapeHtml(i.added_at)})`;
        if (i.status === 'bought') {
            meta += `<br>✅ Koupil: ${escapeHtml(i.action_by)} (${escapeHtml(i.action_at)})`;
        } else if (i.status === 'deleted') {
            meta += `<br>❌ Odebral: ${escapeHtml(i.action_by)} (${escapeHtml(i.action_at)})`;
            if (i.comment) meta += `<br>💬: "${escapeHtml(i.comment)}"`;
        }
        let btns = i.status === 'active'
            ? `<button class="action-btn" onclick="markAsBought(${i.id})">✅</button><button class="action-btn" onclick="markAsDeleted(${i.id})">🗑️</button>`
            : `<button class="action-btn" onclick="${i.status === 'bought' ? 'markAsBought' : 'markAsDeleted'}(${i.id})">↩️</button>`;
        li.innerHTML = `<div class="item-info"><div class="item-top-row"><span class="item-name">${escapeHtml(i.name)}</span><span class="item-count">${escapeHtml(i.count)}</span></div><div class="item-meta">${meta}</div></div><div class="action-btns">${btns}</div>`;
        listEl.appendChild(li);
    });
    clearEl.style.display = Object.values(appData.shoppingItems).some(i => i.status !== 'active') ? 'block' : 'none';
}

document.getElementById('item-input').addEventListener('keypress', function (e) {
    if (e.key === 'Enter') addItem();
});
</script>
</body>
</html>
